<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aircon Units | ESA Cool Aircon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0f766e',
              accent: '#f59e0b',
              dark: '#0f172a',
              panel: '#f8fafc'
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div class="min-h-screen flex">
      <aside class="w-72 bg-slate-900 text-slate-200 hidden lg:flex flex-col">
        <div class="p-6 border-b border-slate-700">
          <h1 class="text-2xl font-bold text-white">ESA Cool</h1>
          <p class="text-sm text-slate-400">Service Management</p>
        </div>

        <nav class="flex-1 p-4 space-y-2">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="customers.html" class="nav-link">Customers</a>
          <a href="aircon-units.html" class="nav-link active">Aircon Units</a>
          <a href="services.html" class="nav-link">Service History</a>
        </nav>

        <div class="p-4 border-t border-slate-700">
          <button id="logoutBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium">Logout</button>
        </div>
      </aside>

      <main class="flex-1">
        <header class="bg-white shadow-sm border-b border-slate-200 p-4 lg:p-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-bold text-slate-900">Aircon Units</h2>
            </div>
            <div class="flex items-center gap-3">
              <button id="addUnitBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-teal-700">Add Unit</button>
              <button class="lg:hidden bg-slate-900 text-white px-4 py-2 rounded-lg" id="mobileMenuBtn">Menu</button>
            </div>
          </div>
        </header>

        <div class="p-4 lg:p-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm mb-6">
            <div class="grid md:grid-cols-2 gap-3">
              <select id="unitCustomerFilter" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="">All customers</option>
              </select>
              <input id="unitSearch" type="search" placeholder="Search by brand or model" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Customer</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Type</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Brand / Model</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Last Cleaning</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Next Cleaning</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Status</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold uppercase text-slate-500">Actions</th>
                  </tr>
                </thead>
                <tbody id="unitTableBody" class="divide-y divide-slate-200"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="unitModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-4xl p-6">
        <div class="flex items-center justify-between mb-6">
          <h3 id="unitModalTitle" class="text-2xl font-bold text-slate-900">Add Aircon Unit</h3>
          <button type="button" id="closeUnitModal" class="text-2xl text-slate-500">✕</button>
        </div>

        <form id="unitForm" class="space-y-4">
          <input type="hidden" id="unitId" />

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Customer</label>
              <select id="unitCustomerId" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Aircon Type</label>
              <select id="unitType" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="Split Type">Split Type</option>
                <option value="Window Type">Window Type</option>
                <option value="Cassette">Cassette</option>
                <option value="Portable">Portable</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Brand</label>
              <input id="unitBrand" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Model</label>
              <input id="unitModel" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Horsepower</label>
              <input id="unitHorsepower" type="number" step="0.5" min="0.5" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Installation Date</label>
              <input id="unitInstallationDate" type="date" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Usage Frequency</label>
              <select id="unitUsageFrequency" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="Light usage">Light usage</option>
                <option value="Regular usage">Regular usage</option>
                <option value="Heavy/Daily usage">Heavy/Daily usage</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Last Cleaning Date</label>
              <input id="unitLastCleaningDate" type="date" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Recommended Cleaning Interval (months)</label>
              <input id="unitRecommendedInterval" type="number" min="1" max="24" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Current Status</label>
              <select id="unitStatus" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="Normal">Normal</option>
                <option value="Upcoming Service">Upcoming Service</option>
                <option value="Due for Cleaning">Due for Cleaning</option>
                <option value="Overdue">Overdue</option>
              </select>
            </div>
          </div>

          <div class="flex justify-end gap-3 pt-2">
            <button type="button" id="cancelUnitBtn" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700">Cancel</button>
            <button type="submit" class="px-5 py-3 rounded-xl bg-primary text-white hover:bg-teal-700">Save Unit</button>
          </div>
        </form>
      </div>
    </div>

    <div id="mobileSidebar" class="hidden fixed inset-0 bg-slate-900/50 z-40">
      <div class="bg-slate-900 text-slate-200 w-72 h-full p-4">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold text-white">ESA Cool</h1>
          </div>
          <button id="closeSidebar" class="text-xl">✕</button>
        </div>
        <nav class="space-y-2">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="customers.html" class="nav-link">Customers</a>
          <a href="aircon-units.html" class="nav-link active">Aircon Units</a>
          <a href="services.html" class="nav-link">Service History</a>
        </nav>
      </div>
    </div>

    <script type="module" src="./js/supabase.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/aircon-units.js"></script>
  </body>
</html>
