<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service History | ESA Cool Aircon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0f766e',
              accent: '#f59e0b',
              dark: '#0f172a',
              panel: '#f8fafc'
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div class="min-h-screen flex">
      <aside class="w-72 bg-slate-900 text-slate-200 hidden lg:flex flex-col">
        <div class="p-6 border-b border-slate-700">
          <h1 class="text-2xl font-bold text-white">ESA Cool</h1>
          <p class="text-sm text-slate-400">Service Management</p>
        </div>

        <nav class="flex-1 p-4 space-y-2">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="customers.html" class="nav-link">Customers</a>
          <a href="aircon-units.html" class="nav-link">Aircon Units</a>
          <a href="services.html" class="nav-link active">Service History</a>
        </nav>

        <div class="p-4 border-t border-slate-700">
          <button id="logoutBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-medium">Logout</button>
        </div>
      </aside>

      <main class="flex-1">
        <header class="bg-white shadow-sm border-b border-slate-200 p-4 lg:p-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-bold text-slate-900">Service History</h2>
            </div>
            <div class="flex items-center gap-3">
              <button id="addServiceBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-teal-700">Add Service</button>
              <button class="lg:hidden bg-slate-900 text-white px-4 py-2 rounded-lg" id="mobileMenuBtn">Menu</button>
            </div>
          </div>
        </header>

        <div class="p-4 lg:p-6">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Customer</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Aircon</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Service Type</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Service Date</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Technician</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase text-slate-500">Notes</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold uppercase text-slate-500">Actions</th>
                  </tr>
                </thead>
                <tbody id="serviceTableBody" class="divide-y divide-slate-200"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="serviceModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-3xl p-6">
        <div class="flex items-center justify-between mb-6">
          <h3 id="serviceModalTitle" class="text-2xl font-bold text-slate-900">Add Service</h3>
          <button type="button" id="closeServiceModal" class="text-2xl text-slate-500">✕</button>
        </div>

        <form id="serviceForm" class="space-y-4">
          <input type="hidden" id="serviceId" />

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Customer</label>
              <select id="serviceCustomerId" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Aircon Unit</label>
              <select id="serviceUnitId" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Service Type</label>
              <select id="serviceType" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option value="General Cleaning">General Cleaning</option>
                <option value="Chemical Cleaning">Chemical Cleaning</option>
                <option value="Repair">Repair</option>
                <option value="Installation">Installation</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Inspection">Inspection</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Service Date</label>
              <input id="serviceDate" type="date" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-slate-700 mb-1">Technician</label>
              <input id="serviceTechnician" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
              <textarea id="serviceNotes" rows="4" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
            </div>
          </div>

          <div class="flex justify-end gap-3 pt-2">
            <button type="button" id="cancelServiceBtn" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700">Cancel</button>
            <button type="submit" class="px-5 py-3 rounded-xl bg-primary text-white hover:bg-teal-700">Save Service</button>
          </div>
        </form>
      </div>
    </div>

    <div id="mobileSidebar" class="hidden fixed inset-0 bg-slate-900/50 z-40">
      <div class="bg-slate-900 text-slate-200 w-72 h-full p-4">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold text-white">ESA Cool</h1>
          </div>
          <button id="closeSidebar" class="text-xl">✕</button>
        </div>
        <nav class="space-y-2">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="customers.html" class="nav-link">Customers</a>
          <a href="aircon-units.html" class="nav-link">Aircon Units</a>
          <a href="services.html" class="nav-link active">Service History</a>
        </nav>
      </div>
    </div>

    <script type="module" src="./js/supabase.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/services.js"></script>
  </body>
</html>
